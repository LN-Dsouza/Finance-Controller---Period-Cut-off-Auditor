services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance_controller
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_controller"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
